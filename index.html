<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Rovagnati — Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar fissa in alto -->
    <header class="nav-bar">
        <div class="logo">MARIO ROVAGNATI</div>
        <div class="nav-links">
            <a href="#progetti">Progetti</a>
            <a href="mailto:mariorovagnati010604@gmail.com" class="cta-btn">Contattami</a>
        </div>
    </header>

    <!-- Sezione Hero ad alto impatto -->
    <section class="hero">
        <h1 class="glitch-text">INFORMATICA. SVILUPPO. PASSIONE.</h1>
        <p>Studente di Informatica per la Comunicazione Digitale — UNIMI</p>
    </section>

    <!-- Sezione Progetti Dinamica (Collegata a GitHub) -->
    <section id="progetti" class="projects-section">
        <h2>I Miei Lavori</h2>
        <div id="github-projects-container">
            <!-- I repository verranno caricati automaticamente qui -->
            <p style="color: #71717a;">Caricamento dei progetti da GitHub in corso...</p>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 Mario Rovagnati. Tutti i diritti riservati. | <a
                href="https://linkedin.com/in/mario-rovagnati-5625a4258/" target="_blank">LinkedIn</a></p>
    </footer>

    <!-- Script per caricare i progetti da GitHub e gestire lo zoom allo scroll -->
    <script>
        async function fetchGitHubProjects() {
            const username = 'mariorova'; // Il tuo username GitHub
            const container = document.getElementById('github-projects-container');

            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated`);
                const repos = await response.json();

                container.innerHTML = '';

                // Filtra escludendo il repository del portfolio e i fork
                const filteredRepos = repos.filter(repo => repo.name !== 'portfolio' && !repo.fork);

                if (filteredRepos.length === 0) {
                    container.innerHTML = '<p>Nessun progetto trovato.</p>';
                    return;
                }

                filteredRepos.forEach(repo => {
                    const card = document.createElement('div');
                    card.className = 'project-card';

                    card.innerHTML = `
                        <div class="project-info">
                            <span class="tag">${repo.language || 'Software'}</span>
                            <h3>${repo.name}</h3>
                            <p>${repo.description || 'Nessuna descrizione disponibile per questo repository.'}</p>
                            <a href="${repo.html_url}" target="_blank" class="link-arrow">Esplora Repository &rarr;</a>
                        </div>
                    `;

                    container.appendChild(card);
                });

                // Attiva l'effetto di zoom dopo il caricamento
                initScrollZoom();

            } catch (error) {
                console.error("Errore nel recupero dei progetti:", error);
                container.innerHTML = '<p style="color: #ff3333;">Impossibile caricare i progetti in questo momento.</p>';
            }
        }

        function initScrollZoom() {
            const cards = document.querySelectorAll('.project-card');

            function handleScroll() {
                cards.forEach(card => {
                    const rect = card.getBoundingClientRect();
                    const windowHeight = window.innerHeight;

                    if (rect.top < windowHeight && rect.bottom > 0) {
                        let progress = (windowHeight - rect.top) / windowHeight;
                        progress = Math.min(Math.max(progress, 0), 1);

                        let scale = 0.85 + (progress * 0.15);
                        let opacity = progress;

                        card.style.transform = `scale(${scale})`;
                        card.style.opacity = opacity;
                    }
                });
            }

            window.addEventListener('scroll', handleScroll);
            handleScroll(); // Esegui subito per la posizione iniziale
        }

        // Avvia il recupero dati all'avvio
        fetchGitHubProjects();
    </script>
</body>

</html>
